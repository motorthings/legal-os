name: Fault-Line Radar

# Regenerates the Legal-AI Fault-Line Radar page on a schedule and commits it.
# Zero infra: a scheduled script writes a static page; GitHub Pages serves docs/radar/.
# v1 scores the curated feed.jsonl deterministically. Ingestion (Voyage) is opt-in.

on:
  schedule:
    - cron: "17 5 * * 1"      # Mondays 05:17 UTC
  workflow_dispatch: {}         # manual trigger from the Actions tab

permissions:
  contents: write               # allow committing the regenerated page
  issues: write                 # allow the re-curation nudge issue

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate radar
        run: python radar/run.py
      - name: Run the radar test suite
        # Includes the copy contract, which fails if the static page and the in-app page
        # stop agreeing on the headings they share. That divergence happened three times on
        # 2026-09-17 and was caught by a person reading a live page each time, not by CI.
        run: python -m pytest radar/tests/ -q
      - name: Build the live advisory landscape
        # The advisory reads a separate, refreshable corpus (see radar/live.py). Building
        # it here keeps the firm-facing landscape current without ever touching the
        # frozen experiment's inputs.
        run: python radar/live.py
      - name: Verify the freeze held
        # Read-only check. If a frozen input changed, fail loudly here rather than let
        # the commit step below carry the change into git as a quiet bot commit.
        run: python radar/freeze.py --check
      - name: Detect stale/thin lines
        id: detect
        run: echo "report=$(python radar/stale_report.py)" >> "$GITHUB_OUTPUT"
      - name: Ping via re-curation issue
        if: startsWith(steps.detect.outputs.report, 'needs re-curation')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPORT="${{ steps.detect.outputs.report }}"
          NUM=$(gh issue list --state open --search "Radar re-curation" --json number --jq '.[0].number' || true)
          if [ -z "$NUM" ]; then
            gh issue create --title "Radar re-curation" --body "$REPORT"
          else
            gh issue edit "$NUM" --body "$REPORT"
          fi
      - name: Commit if changed
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs/radar/index.html docs/radar/data.json docs/radar/kb.json \
                  docs/radar/milestones.json docs/radar/live.json docs/radar/advisory.json
          # Durable run-to-run memory: persist harvested feed rows, the admission
          # ledger, calibration snapshots, and run artifacts so each scheduled run
          # builds on the last (dedup memory survives across CI runs).
          # NOTE: radar/sources/feed.jsonl, harvested.jsonl, fault_lines.py, calibration.py
          # and score.py are deliberately NOT auto-committed. They are the frozen inputs;
          # the "Verify the freeze held" step above fails the run if any of them moved, so
          # a change there should be a human decision with a KNOBS_FROZEN_AT bump, never a
          # bot commit.
          # NOTE: radar/history/runs is deliberately NOT committed. Run artifacts are
          # write-only (nothing reads them) and each re-embeds the full evidence set and
          # weight math, so auto-committing one per run grew the directory by 4 MB in a
          # single afternoon. Run `python radar/run.py --trace` when a replayable record of
          # a specific run is actually wanted, and commit it by hand if it matters.
          git add radar/sources/feed_live.jsonl radar/sources/harvested_live.jsonl \
                  radar/history/admissions.jsonl radar/history/snapshots.jsonl \
                  radar/history/source_reliability.json \
                  radar/history/reviewed.json radar/history/milestones.jsonl \
                  radar/history/leverage.jsonl || true
          if git diff --cached --quiet; then
            echo "No change in radar output."
          else
            git commit -m "radar: regenerate fault-line page [skip ci] (${{ steps.detect.outputs.report }})"
            git push
          fi
